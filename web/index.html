<!DOCTYPE html>
<html>
<head>
  <meta name="google-signin-client_id" content="122741019764-pqvtnhcrficnia4nrom1c66vmn1n7807.apps.googleusercontent.com">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="auction_sheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>auction_sheet</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading-spinner {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFAFC;
      font-family: sans-serif;
      color: #6C63FF;
      flex-direction: column;
      gap: 12px;
    }
    #loading-spinner .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E0E0E8;
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Shown immediately while Flutter's JS bundle downloads, so a slow
       or briefly-stuck load looks like "loading" rather than a dead
       blank screen. Removed automatically once Flutter takes over. -->
  <div id="loading-spinner">
    <div class="spinner"></div>
    <span>Loading admin panel…</span>
  </div>

  <script>
    // Disable the Flutter service worker entirely. This is a low-traffic
    // internal admin tool, so always loading fresh from the network is
    // preferable to risking a stale cached build silently hanging after
    // a redeploy (a known cause of intermittent blank-white-screen loads
    // on Flutter Web).
    window.flutterConfiguration = {
      serviceWorkerVersion: null,
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

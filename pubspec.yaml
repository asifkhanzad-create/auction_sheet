name: auction_sheet
description: Auction sheet request app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.4.0
  firebase_core: ^3.6.0
  http: ^1.2.0
  file_picker: ^8.3.7
  url_launcher: ^6.3.1  
  firebase_auth: ^5.3.0
  google_sign_in: ^7.1.0
  pdfx: ^2.6.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hero_car.png
    - assets/images/welcome_clipboard.png
    - assets/animations/empty_box3.json
    - assets/images/userlogo.png